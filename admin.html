<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إدارة أخبار المملكة الردادية</title>
</head>
<body>
<h1>🔐 إدارة أخبار المملكة الردادية</h1>

<label>عنوان الخبر:</label><br>
<input type="text" id="title"><br><br>

<label>نص الخبر:</label><br>
<textarea id="text"></textarea><br><br>

<button onclick="publish()">نشر الخبر 📰</button>

<script>
function publish() {
    const title = document.getElementById("title").value;
    const text = document.getElementById("text").value;

    if (!title || !text) {
        alert("اكتب العنوان والنص أولاً");
        return;
    }

    localStorage.setItem("newsTitle", title);
    localStorage.setItem("newsText", text);

    alert("تم نشر الخبر!");
}
</script>
</body>
</html>
<article class="card kingdom">

  <h2>🇷🇷 لقاء الرئيس أبو رداد مع أحمد العامري</h2>

  <p>
    في لقاء رسمي، اجتمع الرئيس أبو رداد مع أحمد العامري،
    حيث ناقشا عددًا من الملفات والتطورات المهمة في المملكة الردادية.
  </p>

</article>
